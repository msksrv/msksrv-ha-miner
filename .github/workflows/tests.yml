name: Miner tests

on:
  push:
    branches:
      - main
      - beta
      - "release/**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: |
          python -m pip install uv==0.13.6
          python -m uv pip install --system homeassistant==2026.11.0 \
            pyasic==0.78.12 betterproto==2.0.0b7 pytest pytest-asyncio ruff==0.16.0 \
            -r scripts/ha-smoke-requirements.txt
      - name: Lint and unit tests
        run: |
          python -m ruff check .
          python -m ruff check --isolated scripts/smoke_ha.py
          python -m pytest -o asyncio_default_fixture_loop_scope=function
          python -m scripts.test_device_action_workmode
      - name: Home Assistant and Bitaxe smoke test
        run: |
          sudo unshare --net -- bash -c 'ip link set lo up; exec "$@"' _ \
            "$(command -v python)" scripts/smoke_ha.py custom_components/miner
