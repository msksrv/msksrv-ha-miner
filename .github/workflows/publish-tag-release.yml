# Opens a GitHub Release when you push a version tag (e.g. v1.6.8).
# HACS uses the tagged source tree (custom_components/miner/); GitHub Releases
# must exist (not tags alone). miner.zip is optional for manual installs.

name: Create release from tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Classify pre-release (beta / rc / alpha)
        id: classify
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          PRERELEASE=false
          if [[ "$VERSION" =~ b[0-9]+ ]] \
            || [[ "$VERSION" =~ a[0-9]+ ]] \
            || [[ "$VERSION" == *"-rc"* ]] \
            || [[ "$VERSION" == *"rc."* ]] \
            || [[ "$VERSION" == *"beta"* ]]; then
            PRERELEASE=true
          fi
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify manifest version matches tag
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          MANIFEST_VERSION="$(python3 -c "import json; print(json.load(open('custom_components/miner/manifest.json'))['version'])")"
          if [[ "$MANIFEST_VERSION" != "$VERSION" ]]; then
            echo "::error::manifest.json version ($MANIFEST_VERSION) must match tag ($VERSION) for HACS"
            exit 1
          fi

      - name: ZIP the integration directory (manual install asset)
        shell: bash
        run: |
          cd "${{ github.workspace }}/custom_components/miner"
          find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find . -name '*.pyc' -delete 2>/dev/null || true
          zip -r miner.zip ./ \
            -x "miner.zip" \
            -x "*__pycache__/*" \
            -x "*.pyc" \
            -x "*.pyo"
          if zipinfo -1 miner.zip | grep -qE '__pycache__|\.pyc$|\.pyo$'; then
            echo "::error::miner.zip contains Python bytecode — fix zip exclusions"
            zipinfo -1 miner.zip | grep -E '__pycache__|\.pyc$|\.pyo$' || true
            exit 1
          fi
          echo "miner.zip size: $(wc -c < miner.zip) bytes, files: $(zipinfo -1 miner.zip | wc -l)"

      - name: Create GitHub Release with miner.zip
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.classify.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: ${{ github.workspace }}/custom_components/miner/miner.zip
