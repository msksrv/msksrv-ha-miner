# Opens a GitHub Release when you push a version tag (e.g. v1.4.0b6).
# Betas are marked Pre-release; stable tags (v1.4.0) are full releases.
# miner.zip is attached at publish time (required for immutable releases).

name: Create release from tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Classify pre-release (beta / rc / alpha)
        id: classify
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          PRERELEASE=false
          if [[ "$VERSION" =~ b[0-9]+ ]] \
            || [[ "$VERSION" =~ a[0-9]+ ]] \
            || [[ "$VERSION" == *"-rc"* ]] \
            || [[ "$VERSION" == *"rc."* ]] \
            || [[ "$VERSION" == *"beta"* ]]; then
            PRERELEASE=true
          fi
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Patch manifest version
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("custom_components/miner/manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"] = os.environ["VERSION"]
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

      - name: ZIP the integration directory
        shell: bash
        run: |
          cd "${{ github.workspace }}/custom_components/miner"
          zip -r miner.zip ./

      - name: Create GitHub Release with miner.zip
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.classify.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: ${{ github.workspace }}/custom_components/miner/miner.zip
